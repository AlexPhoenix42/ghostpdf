name: lint

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n ghostpdf.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          additional_files: ghostpdf.sh
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Fish syntax
        run: fish -n ghostpdf.fish

